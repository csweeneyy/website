<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel — Connor Sweeney</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="browser_img.png" />
  <style>
    :root {
      --bg: #544f64;
      --text: #EDF2EF;
      --muted: #9e9aaa;
      --accent: #32936F;
      --yellow-accent: #fff200;
      --font: "Space Mono", "SF Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-font-smoothing: antialiased; cursor: none; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      cursor: none;
    }

    a, button, input, select, textarea { cursor: none; }

    /* ── Crosshair cursor ── */
    .crosshair {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      background: rgba(237, 242, 239, 0.25);
      transition: opacity 0.15s ease;
    }
    .crosshair--v { width: 1px; height: 100vh; top: 0; left: -1px; }
    .crosshair--h { width: 100vw; height: 1px; left: 0; top: -1px; }
    body.cursor-gone .crosshair { opacity: 0; }

    a { color: inherit; text-decoration: none; }

    .back {
      position: fixed;
      top: 28px;
      left: 48px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.3s ease;
      z-index: 10;
    }
    .back:hover { color: var(--text); }
    .back::before { content: "← "; }

    .label {
      position: fixed;
      top: 28px;
      right: 48px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 10;
    }

    /* ── Map ── */
    .map-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      position: relative;
      /* Force hardware acceleration to prevent repaint lag */
      transform: translateZ(0);
      will-change: transform;
    }

    .map {
      font-family: var(--font);
      /* INCREASE these decimals to make the map BIGGER. DECREASE to make it SMALLER. */
      /* 0.65vw controls the max width, 0.9vh controls the max height */
      font-size: clamp(3px, min(0.65vw, 0.9vh), 10px);
      line-height: 1.05;
      letter-spacing: 0.02em;
      color: var(--text);
      white-space: pre;
      user-select: none;
    }

    /* ── Pin overlay layer ── */
    .pin-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── SVG line layer (below pins) ── */
    .line-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .line-layer line {
      stroke: var(--accent);
      stroke-width: 1;
      stroke-dasharray: 4 3;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    .line-layer line.active {
      opacity: 1;
    }

    /* ── Coordinate dot ── */
    .coord-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.8;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .coord-dot.active {
      opacity: 1;
    }

    /* ── Pin box ── */
    .pin {
      position: absolute;
      pointer-events: auto;
      z-index: 3;
      cursor: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .pin:hover {
      transform: scale(1.05);
      z-index: 4;
    }

    .pin__img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2px;
    }

    .pin__caption {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font);
      font-size: 8px;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: #000000;
    }

    .pin:hover .pin__caption {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .back { top: 16px; left: 20px; }
      .label { top: 16px; right: 20px; }
      .map { font-size: 3px; letter-spacing: 0.02em; }
      .crosshair { display: none; }
      .pin__caption { font-size: 6px; bottom: -14px; }
    }
  </style>

<body>
<main id="swup" class="transition-fade">

  <!-- Crosshair -->
  

  <a href="index.html" class="back">Back</a>
  <span class="label">Travel Coming Soon</span>

  <div class="map-wrap" id="map-wrap">
    <pre class="map" id="map"></pre>
    <!-- SVG line layer -->
    <svg class="line-layer" id="line-layer"></svg>
    <!-- Pin overlay -->
    <div class="pin-layer" id="pin-layer"></div>
  </div>

  <script>
(function() {
// ═══════════════════════════════════════════════════════
// TRAVEL PINS CONFIG
    // ═══════════════════════════════════════════════════════
    //
    // HOW TO ADD A NEW PIN:
    // 1. Drop your image into the  travel-photos/  folder
    // 2. Add a new entry to the PINS array below
    //
    // Each pin has:
    //   image   → filename inside travel-photos/
    //   caption → short text shown on hover
    //   pin     → { x, y } percentage position of the IMAGE BOX on the page
    //             (0,0) = top-left of map, (100,100) = bottom-right
    //   coord   → { x, y } percentage position of the actual PLACE on the map
    //             the hover line will draw from the image box to this point
    //   size    → { w, h } pixel dimensions of the image box
    //
    // TIP: To find coordinates, open the page and hover over the map —
    //      the crosshair position relative to the map helps you estimate.
    //      Or use the built-in debug mode: add ?debug to the URL.
    //
    // ═══════════════════════════════════════════════════════

    let PINS = [];

    // ═══════════════════════════════════════════════════════
    // RENDERING (you don't need to touch anything below)
    // ═══════════════════════════════════════════════════════

    // Crosshair cursor (optimized for performance)
    const crossV = document.getElementById("crosshair-v");
    const crossH = document.getElementById("crosshair-h");
    
    let isTicking = false;
    document.addEventListener("mousemove", (e) => {
      if (!isTicking) {
        window.requestAnimationFrame(() => {
          crossV.style.left = e.clientX + "px";
          crossH.style.top  = e.clientY + "px";
          isTicking = false;
        });
        isTicking = true;
      }
    });
    
    document.addEventListener("mouseenter", () => document.body.classList.remove("cursor-gone"));
    document.addEventListener("mouseleave", () => document.body.classList.add("cursor-gone"));

    // Debug mode — shows coordinate % on hover and allows dragging pins
    const isDebug = false; // set to true or use ?debug in URL to edit pins

    const mapWrap = document.getElementById("map-wrap");
    const mapEl   = document.getElementById("map");
    const lineLayer = document.getElementById("line-layer");
    const pinLayer  = document.getElementById("pin-layer");

    // Hide pins/lines until map animation finishes
    pinLayer.style.opacity = '0';
    lineLayer.style.opacity = '0';

    // Load pins from JSON, then load and animate the map
    fetch('pins.json?v=' + Date.now())
      .then(r => r.json())
      .then(pins => {
        PINS = pins;
        return fetch('map_test2.txt?v=' + Date.now());
      })
      .then(r => r.text())
      .then(text => {
        // Typewriter animation
        const duration = 1500; // ms
        const start = performance.now();
        const totalChars = text.length;

        // Ensure container holds its shape by setting the full text,
        // measuring, then setting explicit height/width
        mapEl.style.visibility = 'hidden';
        mapEl.textContent = text;
        
        // Wait for next frame so dimensions are calculated
        requestAnimationFrame(() => {
          const mapW = mapEl.clientWidth;
          const mapH = mapEl.clientHeight;
          
          mapEl.style.width = mapW + 'px';
          mapEl.style.height = mapH + 'px';
          mapEl.style.display = 'inline-block'; // needed for explicit width/height
          mapEl.style.visibility = 'visible';
          
          function animateMap(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            
            // Linear progression for typewriter effect looks best
            const count = Math.floor(progress * totalChars);
            
            // Show the first 'count' characters, hide the rest by making them transparent
            // We use HTML to color the remaining characters transparent so the layout is preserved perfectly
            const visibleText = text.substring(0, count);
            const hiddenText = text.substring(count);
            
            // Escape HTML for safety, though the map is just ASCII art
            const safeVisible = visibleText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeHidden = hiddenText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            mapEl.innerHTML = safeVisible + '<span style="opacity: 0;">' + safeHidden + '</span>';

            if (progress < 1) {
              requestAnimationFrame(animateMap);
            } else {
              mapEl.textContent = text; // Clean up HTML
              
              // Remove explicit sizing so it can resize on window resize
              mapEl.style.width = '';
              mapEl.style.height = '';
              mapEl.style.display = '';

              // Fade in pins after map is done
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  renderPins();
                  pinLayer.style.transition = 'opacity 0.4s ease';
                  lineLayer.style.transition = 'opacity 0.4s ease';
                  pinLayer.style.opacity = '1';
                  lineLayer.style.opacity = '1';
                  if (isDebug) enableDebug();
                });
              });
            }
          }
          requestAnimationFrame(animateMap);
        });
      });

    function renderPins() {
      const mapRect = mapEl.getBoundingClientRect();
      const wrapRect = mapWrap.getBoundingClientRect();

      // Map offset inside the wrap (since map is centered)
      const mapOffsetX = mapRect.left - wrapRect.left;
      const mapOffsetY = mapRect.top - wrapRect.top;
      const mapW = mapRect.width;
      const mapH = mapRect.height;

      // Clear previous renders
      pinLayer.innerHTML = "";
      lineLayer.innerHTML = "";

      PINS.forEach((pin, i) => {
        // Calculate pixel positions relative to map-wrap
        const pinPx = {
          x: mapOffsetX + (pin.pin.x / 100) * mapW,
          y: mapOffsetY + (pin.pin.y / 100) * mapH,
        };
        const coordPx = {
          x: mapOffsetX + (pin.coord.x / 100) * mapW,
          y: mapOffsetY + (pin.coord.y / 100) * mapH,
        };

        // ── Pin box ──
        const el = document.createElement("div");
        el.className = "pin";
        el.style.left = (pinPx.x - pin.size.w / 2) + "px";
        el.style.top  = (pinPx.y - pin.size.h / 2) + "px";
        el.style.width  = pin.size.w + "px";
        el.style.height = pin.size.h + "px";

        const img = document.createElement("img");
        img.className = "pin__img";
        img.src = "travel-photos/" + pin.image;
        img.alt = pin.caption;
        img.draggable = false;
        el.appendChild(img);

        const caption = document.createElement("span");
        caption.className = "pin__caption";
        caption.textContent = pin.caption;
        el.appendChild(caption);

        pinLayer.appendChild(el);

        // ── Coordinate dot ──
        const dot = document.createElement("div");
        dot.className = "coord-dot";
        dot.style.left = coordPx.x + "px";
        dot.style.top  = coordPx.y + "px";
        pinLayer.appendChild(dot);

        // ── SVG line ──
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", pinPx.x);
        line.setAttribute("y1", pinPx.y);
        line.setAttribute("x2", coordPx.x);
        line.setAttribute("y2", coordPx.y);
        lineLayer.appendChild(line);

        // ── Hover interactions ──
        el.addEventListener("mouseenter", () => {
          line.classList.add("active");
          dot.classList.add("active");
        });
        el.addEventListener("mouseleave", () => {
          line.classList.remove("active");
          dot.classList.remove("active");
        });
      });
    }

    // ── Debug overlay — shows % coordinates + draggable pins ──
    function enableDebug() {
      // Coordinate label (bottom-left)
      const debugLabel = document.createElement("div");
      debugLabel.style.cssText = `
        position: fixed; bottom: 16px; left: 16px; z-index: 9999;
        font-family: var(--font); font-size: 11px; color: var(--accent);
        background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
        pointer-events: none; white-space: pre;
      `;
      document.body.appendChild(debugLabel);

      // Output panel (top-left) — live pin values
      const outputPanel = document.createElement("div");
      outputPanel.style.cssText = `
        position: fixed; top: 60px; left: 16px; z-index: 9999;
        font-family: var(--font); font-size: 9px; color: var(--accent);
        background: rgba(0,0,0,0.85); padding: 12px 14px; border-radius: 4px;
        pointer-events: none; white-space: pre; line-height: 1.6;
      `;
      document.body.appendChild(outputPanel);

      function updateOutput() {
        let text = "PIN VALUES (drag to update)\n";
        text += "─".repeat(34) + "\n";
        PINS.forEach((p, i) => {
          text += `${p.caption}\n`;
          text += `  pin:   { x: ${p.pin.x}, y: ${p.pin.y} }\n`;
          text += `  coord: { x: ${p.coord.x}, y: ${p.coord.y} }\n`;
        });
        outputPanel.textContent = text;
      }
      updateOutput();

      // Save button
      let hasUnsaved = false;
      const saveBtn = document.createElement("button");
      saveBtn.textContent = "Save pins";
      saveBtn.style.cssText = `
        position: fixed; bottom: 16px; right: 16px; z-index: 9999;
        font-family: var(--font); font-size: 11px; color: var(--bg);
        background: var(--accent); border: none; padding: 8px 16px;
        border-radius: 4px; cursor: pointer; opacity: 0.4;
        transition: opacity 0.2s ease;
      `;
      document.body.appendChild(saveBtn);

      function markDirty() {
        hasUnsaved = true;
        saveBtn.style.opacity = '1';
        saveBtn.textContent = '● Save pins';
      }

      saveBtn.addEventListener('click', () => {
        fetch('/save-pins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(PINS, null, 2)
        }).then(() => {
          hasUnsaved = false;
          saveBtn.style.opacity = '0.4';
          saveBtn.textContent = 'Saved ✓';
          setTimeout(() => { saveBtn.textContent = 'Save pins'; }, 1500);
        }).catch(() => {
          saveBtn.textContent = 'Error ✗';
          setTimeout(() => { saveBtn.textContent = '● Save pins'; }, 1500);
        });
      });

      // Coordinate display on hover
      let debugTicking = false;
      mapWrap.addEventListener("mousemove", (e) => {
        if (!debugTicking) {
          window.requestAnimationFrame(() => {
            const mapRect = mapEl.getBoundingClientRect();
            const xPct = ((e.clientX - mapRect.left) / mapRect.width * 100).toFixed(1);
            const yPct = ((e.clientY - mapRect.top) / mapRect.height * 100).toFixed(1);
            debugLabel.textContent = `x: ${xPct}%  y: ${yPct}%`;
            debugTicking = false;
          });
          debugTicking = true;
        }
      });

      // ── Draggable pins and coord dots ──
      const allPins = pinLayer.querySelectorAll(".pin");
      const allDots = pinLayer.querySelectorAll(".coord-dot");
      const allLines = lineLayer.querySelectorAll("line");

      function makeDraggable(el, i, type) {
        el.style.pointerEvents = "auto";
        el.style.cursor = "grab";
        if (type === "dot") {
        }
        let dragging = false, startX, startY, origLeft, origTop;

        el.addEventListener("mousedown", (e) => {
          dragging = true;
          el.style.cursor = "grabbing";
          startX = e.clientX;
          startY = e.clientY;
          origLeft = parseFloat(el.style.left);
          origTop = parseFloat(el.style.top);
          e.preventDefault();
          e.stopPropagation();
        });

        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const newLeft = origLeft + dx;
          const newTop = origTop + dy;
          el.style.left = newLeft + "px";
          el.style.top = newTop + "px";

          const mapRect = mapEl.getBoundingClientRect();
          const wrapRect = mapWrap.getBoundingClientRect();
          const offsetX = mapRect.left - wrapRect.left;
          const offsetY = mapRect.top - wrapRect.top;
          const mapW = mapRect.width;
          const mapH = mapRect.height;

          if (type === "pin") {
            const cx = newLeft + PINS[i].size.w / 2;
            const cy = newTop + PINS[i].size.h / 2;
            allLines[i].setAttribute("x1", cx);
            allLines[i].setAttribute("y1", cy);
            const xPct = parseFloat(((cx - offsetX) / mapW * 100).toFixed(1));
            const yPct = parseFloat(((cy - offsetY) / mapH * 100).toFixed(1));
            PINS[i].pin.x = xPct;
            PINS[i].pin.y = yPct;
            debugLabel.textContent = `pin[${i}] → { x: ${xPct}, y: ${yPct} }`;
          } else {
            allLines[i].setAttribute("x2", newLeft);
            allLines[i].setAttribute("y2", newTop);
            const xPct = parseFloat(((newLeft - offsetX) / mapW * 100).toFixed(1));
            const yPct = parseFloat(((newTop - offsetY) / mapH * 100).toFixed(1));
            PINS[i].coord.x = xPct;
            PINS[i].coord.y = yPct;
            debugLabel.textContent = `coord[${i}] → { x: ${xPct}, y: ${yPct} }`;
          }
          updateOutput();
        });

        document.addEventListener("mouseup", () => {
          if (dragging) {
            dragging = false;
            el.style.cursor = "grab";
            markDirty();
          }
        });
      }

      allPins.forEach((pinEl, i) => makeDraggable(pinEl, i, "pin"));
      allDots.forEach((dotEl, i) => makeDraggable(dotEl, i, "dot"));
    }

    // ── Recalculate on resize ──
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderPins, 150);
    });
})();
  </script>


</main>
